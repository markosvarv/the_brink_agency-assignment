services:
  - type: web
    name: payload-cms-brink
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: DATABASE_URI
        value: file:/var/data/payload.db
      - key: NEXT_PUBLIC_SERVER_URL
        sync: false
    disk:
      name: payload-data
      mountPath: /var/data
      sizeGB: 1
